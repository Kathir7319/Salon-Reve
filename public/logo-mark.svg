<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7B5" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7E56" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918" />
      <stop offset="100%" stop-color="#0E0E0D" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Atelier Disk -->
  <circle cx="60" cy="60" r="58" fill="url(#darkBg)" stroke="url(#goldLinear)" stroke-width="1.5" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#C5A880" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 3" />

  <!-- Monogram R with flowing hair wave geometry -->
  <!-- Left Serif Pillar -->
  <path d="M 40 34 L 46 34 L 46 86 L 40 86 M 40 34 L 48 34 M 40 86 L 48 86" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 43 36 L 43 84" fill="none" stroke="url(#goldLinear)" stroke-width="4.5" stroke-linecap="square" />

  <!-- Flowing Hair Wave Upper Bowl -->
  <path d="M 43 38 C 65 37, 78 43, 78 54 C 78 65, 65 69, 44 69" fill="none" stroke="url(#goldLinear)" stroke-width="3" stroke-linecap="round" />
  <path d="M 44 43 C 60 42, 71 46, 71 54 C 71 61, 61 65, 44 65" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-opacity="0.6" />

  <!-- Swirling Wave Leg (Digital Perm C-Curl Flourish) -->
  <path d="M 58 68 C 67 76, 76 84, 88 85 C 82 87, 72 83, 62 73" fill="url(#goldLinear)" />
  <path d="M 56 67 C 68 76, 77 82, 88 84" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Celestial K-Beauty Accent / Scissors Sparkle Star -->
  <g transform="translate(77, 33)">
    <circle cx="0" cy="0" r="2.5" fill="url(#goldLinear)" filter="url(#subtleGlow)" />
    <path d="M 0 -6 L 0 6 M -6 0 L 6 0" stroke="url(#goldLinear)" stroke-width="1" stroke-linecap="round" />
    <path d="M -2.5 -2.5 L 2.5 2.5 M -2.5 2.5 L 2.5 -2.5" stroke="url(#goldLinear)" stroke-width="0.6" stroke-opacity="0.7" />
  </g>

  <!-- Korean Hangul Subscript: 살롱 레브 -->
  <text x="60" y="103" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="5.5" font-weight="600" fill="#EAD7B5" letter-spacing="4" text-anchor="middle" opacity="0.9">
    살롱 레브
  </text>
</svg>
